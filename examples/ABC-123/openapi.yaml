openapi: 3.0.3
info:
  title: Illustrative BFF service error-rate contract
  version: 0.1.0
paths:
  /api/services/error-rates:
    get:
      operationId: listServiceErrorRates
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
          description: Inclusive UTC epoch milliseconds
        - in: query
          name: to
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
          description: Exclusive UTC epoch milliseconds, greater than from
      responses:
        '200':
          description: Services scoped to the authenticated tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [service, errors, total, errorRate]
                  properties:
                    service: { type: string }
                    errors: { type: integer, format: int64, minimum: 0 }
                    total: { type: integer, format: int64, minimum: 0 }
                    errorRate:
                      type: number
                      nullable: true
                      minimum: 0
                      maximum: 1
                      description: errors / total, null when total is zero
        '400': { description: Invalid time range }
        '401': { description: Authentication required }
        '403': { description: Access denied }
        '504': { description: Upstream timeout with recoverable error body }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
